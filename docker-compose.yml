services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"            
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ui:
    build: ./ui

  api:
    build:
      context: .
      dockerfile: API.Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Db: "Host=db;Database=liag;Username=liag;Password=${DB_PASSWORD}"
      ConnectionStrings__AzureCommunicationService: "endpoint=https://localhost/;accesskey=ZHVtbXk="
      Auth__SameSite: "Lax"
      Auth__SecurePolicy: "SameAsRequest"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: liag
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liag -d liag"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg-data:
