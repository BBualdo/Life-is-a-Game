x-managed: &managed
  restart: unless-stopped
  labels:
    liag.managed: "true"

x-dotnet-env: &dotnet-env
  ASPNETCORE_HTTP_PORTS: "8080"
  DataProtection__KeysPath: /keys
  Auth__CookieName: LIAGToken
  Auth__SameSite: Lax
  Auth__SecurePolicy: SameAsRequest
  Internal__Key: ${INTERNAL_KEY}

services:
  gateway:
    <<: *managed
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ui:
    <<: *managed
    build: ./ui

  core-api:
    <<: *managed
    build:
      context: .
      dockerfile: API.Dockerfile
    environment:
      <<: *dotnet-env
      ConnectionStrings__Db: "Host=db-core;Database=core;Username=liag;Password=${DB_PASSWORD}"
      ConnectionStrings__AzureCommunicationService: "endpoint=https://localhost/;accesskey=ZHVtbXk="
    volumes:
      - dp-keys:/keys
    depends_on:
      db-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  missions-api:
    <<: *managed
    build: ./src/missions-api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Db: "Host=db-missions;Database=missions;Username=liag;Password=${DB_PASSWORD}"
      Services__CoreUrl: http://core-api:8080
    volumes:
      - dp-keys:/keys
    depends_on:
      db-missions:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  achievements-api:
    <<: *managed
    build: ./src/achievements-api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Db: "Host=db-achievements;Database=achievements;Username=liag;Password=${DB_PASSWORD}"
      Services__CoreUrl: http://core-api:8080
    volumes:
      - dp-keys:/keys
    depends_on:
      db-achievements:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  db-core:
    <<: *managed
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: core
    volumes:
      - pg-core:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liag -d core"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-missions:
    <<: *managed
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: missions
    volumes:
      - pg-missions:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liag -d missions"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-achievements:
    <<: *managed
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liag
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: achievements
    volumes:
      - pg-achievements:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liag -d achievements"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dp-keys:
  pg-core:
  pg-missions:
  pg-achievements:
