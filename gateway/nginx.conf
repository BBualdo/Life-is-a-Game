resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/auth/ {
        set $core http://core-api:8080;
        proxy_pass $core;
    }
    location /api/user/ {
        set $core http://core-api:8080;
        proxy_pass $core;
    }

    location /api/missions/ {
        set $missions http://missions-api:8080;
        proxy_pass $missions;
    }

    location /api/achievements/ {
        set $achievements http://achievements-api:8080;
        proxy_pass $achievements;
    }

    location / {
        set $ui http://ui:3000;
        proxy_pass $ui;
    }
}
